[package]
name = "gimp-sys"
version = "0.1.0"
description = "GIMP 3 (libgimp) FFI bindings"
readme = "README.md"
keywords = ["gimp", "ffi", "plugin", "gegl", "glib"]
categories = ["external-ffi-bindings", "multimedia::images"]
build = "build.rs"

[package.edition]
workspace = true

[package.rust-version]
workspace = true

[package.license]
workspace = true

[package.repository]
workspace = true

[package.metadata.system-deps.gimp_3_0]
name = "gimp-3.0"
version = "3"

[package.metadata.system-deps.gimp_3_0.v3_0_8]
version = "3.0.8"

[package.metadata.system-deps.gimp_3_0.v3_1]
version = "3.1"

[package.metadata.system-deps.gimp_3_0.v3_2]
version = "3.2"

[package.metadata.system-deps.gimp_3_0.v3_2_4]
version = "3.2.4"

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]
all-features = true

[lib]
name = "gimp_sys"

[dependencies]
libc = "0.2"

[dependencies.babl-sys]
workspace = true

[dependencies.gexiv2-sys]
package = "gimp-gexiv2-sys"
path = "../../gexiv2/sys"
version = "0.1"

[dependencies.glib-sys]
workspace = true

[dependencies.gobject-sys]
workspace = true

[dependencies.gdk-pixbuf-sys]
workspace = true

[dependencies.gegl-sys]
workspace = true

[dependencies.gio-sys]
workspace = true

[dependencies.pango-sys]
workspace = true

[dependencies.cairo-sys-rs]
workspace = true

[build-dependencies]
system-deps = "7"

[dev-dependencies]
shell-words = "1.0.0"
tempfile = "3"

[features]
v3_0_8 = []
v3_1 = ["v3_0_8"]
v3_2 = ["v3_1"]
v3_2_4 = ["v3_2"]
